      type: object
      title: CompanyPaymentDto
    CompanyDetailsDto:
      type: object
      title: CompanyDetailsDto
    Iterable_Map_string_object_:
      type: object
      title: Iterable«Map«string,object»»
    MiniUser:
      type: object
      title: MiniUser
    ObserverUserDto:
      type: object
      title: ObserverUserDto
    MergeCompanyDto:
