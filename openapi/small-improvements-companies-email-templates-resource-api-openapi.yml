components:
  schemas:
    EmailTemplatePreview:
      type: object
      title: EmailTemplatePreview
    EmailTemplateModificationInfo:
      type: object
      title: EmailTemplateModificationInfo
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Personal access token generated from user profile settings
