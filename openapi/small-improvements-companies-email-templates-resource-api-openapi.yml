      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/EmailTemplateModificationInfo'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
