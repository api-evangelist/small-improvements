      - calendar-resource
      summary: getEvents
      operationId: getEventsUsingGET
      parameters:
      - name: from
        in: query
        description: from
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Iterable_CalendarEventDTO_'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
