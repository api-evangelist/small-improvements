          - REVIEW_INFORM_TEAM_MEMBER
          - REVIEW_NUDGE_MANAGER
          - REVIEW_NUDGE_MANAGER_UNSPECIFIC
          - REVIEW_NUDGE_REPORT
          - REVIEW_NUDGE_SECONDARY_REVIEWER_UNSPECIFIC
          - REVIEW_SHARE_WITH_EMPLOYEE
