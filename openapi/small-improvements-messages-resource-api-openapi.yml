components:
  schemas:
    Iterable_UserMessageStatisticsDto_:
      type: object
      title: Iterable«UserMessageStatisticsDto»
    UserIdHolder:
      type: object
      title: UserIdHolder
    MessageRelevantView:
      type: object
      title: MessageRelevantView
    MessageDTO:
      type: object
      title: MessageDTO
    DownloadableFileDto:
      type: object
      title: DownloadableFileDto
    MessageDto:
      type: object
      title: MessageDto
    MessagePreviewWithStatus:
      type: object
      title: MessagePreviewWithStatus
  requestBodies:
    UserIdHolderArray:
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/UserIdHolder'
      description: users
      required: true
    MessageDTO:
      content:
        application/json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/MessageDTO'
      description: dto
      required: true
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Personal access token generated from user profile settings
