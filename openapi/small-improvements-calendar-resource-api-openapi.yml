        description: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarDTO'
        description: calendarDto
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
