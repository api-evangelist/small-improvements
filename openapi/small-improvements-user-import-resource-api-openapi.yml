        description: type
        required: true
        schema:
          type: string
          enum:
          - BAMBOO
          - CSV
          - GOOGLE_APPS
          - NAMELY
          - PERSONIO
          - SAPLING
      requestBody:
        $ref: '#/components/requestBodies/importUsersCsvUsingPOSTData'
      responses:
        '200':
