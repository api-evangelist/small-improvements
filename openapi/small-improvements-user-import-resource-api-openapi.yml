                $ref: '#/components/schemas/SimulationDto'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /v2/user-import/GOOGLE_APPS/simulation/{id}:
