openapi: 3.2.0
info:
  description: The Small Improvements REST API (v2) provides programmatic access to the core performance management platform, covering users, feedback cycles, review questionnaires, objectives, 1:1 meetings, pulse surveys, praise, messages, and administrative settings. Authentication uses personal Bearer access tokens generated from user profile settings.
  version: '2.0'
  title: Small Improvements User Import Resource API
  contact:
    url: https://www.small-improvements.com
    name: Small Improvements
  x-api-id: small-improvements-rest-api
servers:
- url: https://app.small-improvements.com/api
  description: Small Improvements API
security:
- BearerAuth: []
tags:
- name: user-import-resource
  description: User Import Resource
paths:
  /v2/user-import/CSV:
    post:
      tags:
      - user-import-resource
      summary: importUsersCsv
      operationId: importUsersCsvUsingPOST
      parameters:
      - name: company
        in: query
        description: company
        required: false
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/importUsersCsvUsingPOSTData'
      responses:
        '200':
          description: OK
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /v2/user-import/GOOGLE_APPS:
    post:
      tags:
      - user-import-resource
      summary: importGoogleAppsUsers
      operationId: importGoogleAppsUsersUsingPOST
      requestBody:
        $ref: '#/components/requestBodies/importUsersCsvUsingPOSTData'
      responses:
        '200':
          description: OK
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /v2/user-import/GOOGLE_APPS/preview:
