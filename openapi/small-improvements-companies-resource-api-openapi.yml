      parameters:
      - name: onlyPaying
        in: query
        description: onlyPaying
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /v2/companies/merge:
