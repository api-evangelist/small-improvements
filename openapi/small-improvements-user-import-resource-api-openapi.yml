        description: company
        required: false
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/importUsersCsvUsingPOSTData'
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                type: object
                additionalProperties:
                  type: string
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /v2/user-import/GOOGLE_APPS/preview/{id}:
    get:
      tags:
      - user-import-resource
      summary: getGoogleAppsPreview
      operationId: getGoogleAppsPreviewUsingGET
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UserImportPreview'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
